name: Windows test build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'yunxi1732/myrpg' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Generate HybridCLR code and Addressables content for the client
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.10f1
          targetPlatform: StandaloneWindows64
          buildMethod: Rpg.Editor.RpgResourceUpdateSetup.BuildForCi
          customParameters: -rpgReleaseId windows-${{ github.run_id }}-${{ github.sha }}

      - name: Build Windows client
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.10f1
          targetPlatform: StandaloneWindows64

      - name: Record build identity
        id: identity
        shell: pwsh
        run: |
          $root = 'build/StandaloneWindows64'
          $player = Get-ChildItem -LiteralPath $root -Filter '*.exe' -File -Recurse |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.DirectoryName ($_.BaseName + '_Data')) } |
            Select-Object -First 1
          if ($null -eq $player) { throw 'Windows player executable and matching Data folder were not found.' }
          $gameAssembly = Join-Path $player.DirectoryName 'GameAssembly.dll'
          $metadata = Join-Path $player.DirectoryName ($player.BaseName + '_Data/il2cpp_data/Metadata/global-metadata.dat')
          $localCatalog = Join-Path $player.DirectoryName ($player.BaseName + '_Data/StreamingAssets/aa/catalog.bin')
          $hotDll = 'Library/HybridCLR/HotUpdateDlls/StandaloneWindows64/Rpg.HotUpdate.dll'
          foreach ($required in @($gameAssembly, $metadata, $localCatalog, $hotDll)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "Required IL2CPP or hot-update output is missing: $required" }
          }
          $versionMatch = Select-String -LiteralPath 'ProjectSettings/ProjectSettings.asset' -Pattern '^\s*bundleVersion:\s*(\S+)' | Select-Object -First 1
          $layoutMatch = Select-String -LiteralPath 'Assets/Scripts/Bootstrap/ResourceUpdateController.cs' -Pattern 'public const int ScriptAssemblyVersion\s*=\s*(\d+);' | Select-Object -First 1
          if ($null -eq $versionMatch -or $null -eq $layoutMatch) { throw 'Client or script assembly version was not found.' }
          $stamp = [DateTime]::UtcNow.ToString('yyyyMMddTHHmmssZ')
          "timestamp=$stamp" >> $env:GITHUB_OUTPUT
          @("commit=$env:GITHUB_SHA", "built_at_utc=$stamp",
            "client_version=$($versionMatch.Matches[0].Groups[1].Value)",
            "script_assembly_version=$($layoutMatch.Matches[0].Groups[1].Value)",
            "player_sha256=$((Get-FileHash -LiteralPath $player.FullName -Algorithm SHA256).Hash)",
            "game_assembly_sha256=$((Get-FileHash -LiteralPath $gameAssembly -Algorithm SHA256).Hash)",
            "hot_update_dll_sha256=$((Get-FileHash -LiteralPath $hotDll -Algorithm SHA256).Hash)") |
            Set-Content -LiteralPath (Join-Path $root 'build-info.txt')

      - name: Upload Windows test client
        uses: actions/upload-artifact@v4
        with:
          name: rpg-windows-${{ github.sha }}-${{ steps.identity.outputs.timestamp }}
          path: build/StandaloneWindows64/
          if-no-files-found: error
          retention-days: 14
